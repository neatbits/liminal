<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Draw liminal spaces in 2D, see them in 3D and walk through them." />
    <title>Liminal Simulator</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Liminal Simulator" />
    <meta property="og:title" content="A room in Liminal Simulator" />
    <meta property="og:description" content="Someone shared an empty room with you. Open it and walk through it in your browser." />
    <meta property="og:url" content="https://liminalsimulator.com/app/" />
    <meta property="og:image" content="https://liminalsimulator.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An empty mall atrium with two floors of galleries, seen through a VHS filter" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#c9b56a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c9b56a'/%3E%3Crect x='7' y='9' width='18' height='4' rx='1' fill='%23fff8dc'/%3E%3Crect x='7' y='17' width='8' height='8' fill='%235a5d62'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
  </head>
  <body>
    <div id="app" data-layout="split">
      <header class="topbar">
        <a class="brand" href="../" title="Liminal Simulator – front page"><span class="brand-mark"></span>Liminal</a>
        <nav class="menus" id="menus"></nav>
        <div class="toolbar">
          <button type="button" class="btn" id="btn-undo" title="Undo (Ctrl+Z)">↶ Undo</button>
          <button type="button" class="btn" id="btn-redo" title="Redo (Ctrl+Y)">↷ Redo</button>
          <div class="segmented" id="layout-toggle" role="group" aria-label="View">
            <button type="button" data-layout="2d">2D</button>
            <button type="button" data-layout="split">2D + 3D</button>
            <button type="button" data-layout="3d">3D</button>
          </div>
        </div>
        <div class="topbar-right">
          <button type="button" class="btn" data-feedback>Suggestions</button>
          <span class="room-badge" id="room-badge"></span>
          <button type="button" class="btn" id="btn-drift" title="Dream walk: drift slowly through the rooms on your own (fullscreen)">🌙 Drift</button>
          <button type="button" class="btn btn-accent" id="btn-walk-top" title="Walk through the room in fullscreen – Esc to come back">▶ Walk the room</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" id="sidebar"></aside>

        <section class="pane pane-2d">
          <header class="pane-head">
            <span class="pane-title">2D plan</span>
            <span class="pane-sub" id="hover-info"></span>
            <div class="pane-actions">
              <button type="button" class="chip" id="btn-fit" title="Fit plan (0)">⤢ Fit</button>
            </div>
          </header>
          <div class="pane-body editor-body"><canvas id="editor-canvas"></canvas></div>
        </section>

        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

        <section class="pane pane-3d">
          <header class="pane-head">
            <span class="pane-title">3D preview</span>
            <div class="pane-actions" id="view-actions">
              <button type="button" class="chip" data-view="perspective" title="Look at the room from an angle">3D</button>
              <button type="button" class="chip" data-view="top" title="Look straight down">Top</button>
              <button type="button" class="chip" data-view="reset" title="Back to the starting view">Reset</button>
              <button type="button" class="chip" data-view="photo" title="Take a photo of the 3D view (P while walking)">📷 Photo</button>
            </div>
          </header>
          <div class="pane-body viewport3d" id="viewport3d">
            <!-- Visningsinnstillinger: stemning, lysfarge og størrelsen på de uendelige nivåene (skjules i gåmodus). -->
            <div class="view-settings" id="view-settings">
              <label class="view-setting" title="Mood while walking: how liminal – or how scary – it gets"><span>Mood</span>
              <select id="mood-select">
                <option value="normal">Normal</option>
                <option value="abandoned">Abandoned</option>
                <option value="liminal">Liminal</option>
                <option value="uncanny">Uncanny</option>
                <option value="nightmare">Nightmare</option>
              </select></label>
              <label class="view-setting" title="Light colour: the room's own, or another that overrides it – Shifting glides slowly between colours"><span>Light</span>
              <select id="light-select"></select></label>
              <label class="view-setting" title="Size of the new levels you reach through doors to nowhere"><span>New levels</span>
              <select id="size-select">
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
                <option value="huge">Huge</option>
              </select></label>
              <button type="button" class="view-setting view-toggle" id="btn-music" title="Music on/off (N while walking)">♪ Music</button>
            </div>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="status-tool"></span>
        <span id="status-build"></span>
      </footer>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <input type="file" id="file-input" accept=".json,application/json" hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
